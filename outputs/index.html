async function bookPublicAppointment(){

function previewPhoto(input,imgId){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>document.getElementById(imgId).src=r.result;r.readAsDataURL(f);}
async function saveProfile(){
  Object.assign(state.profile,{photo:document.getElementById("docPhotoPreview").src,name:val("docName"),specialty:val("docSpec"),qualification:val("docQual"),registration:val("docReg"),experience:val("docExp"),clinic:val("docClinic"),location:val("docLoc"),mobile:val("docMob"),email:val("docEmail"),fee:val("docFee"),address:val("docAddr"),bio:val("docBio"),link:val("docLink")});
  if(supabaseClient && currentUser){
    const {error} = await supabaseClient.from("doctors").upsert(doctorRowFromProfile(state.profile,currentUser));
    if(error) return toast(error.message);
    await loadDoctorProfile();
    await loadPublicDoctorProfile();
  } else {
    saveState();
  }
  closeDrawer(); render(); toast("Profile saved.");
}
function openConsultDrawer(apid){
  const ap=appt(apid), p=patient(ap.patientId);
  openDrawer("Complete Consultation",`<div class="form-grid">${prescriptionPanel(ap,p)}<div class="field full"><label>Reason for consultation</label><input id="csReason" value="${esc(ap.reason)}"></div><div class="field full"><label>Brief clinical context / patient concern</label><textarea id="csContext">${esc(p.background||"")}</textarea></div><div class="field full"><label>Assessment / Impression</label><textarea id="csAssess"></textarea></div><div class="field full"><label>Plan / Advice</label><textarea id="csPlan"></textarea></div><div class="field full"><label>What happens next?</label><div class="next-options">${Object.entries(NEXT_STEP_LABELS).map(([k,l],i)=>`<label class="radio-card ${i===0?'active':''}" onclick="selectNext('${k}')"><input type="radio" name="nextStep" value="${k}" ${i===0?'checked':''}><span><b>${l}</b></span></label>`).join("")}</div></div><div class="field full" id="nextFields">${nextFields("followup")}</div></div>`,`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="saveConsultation('${apid}')">Save Consultation</button>`);
}
function prescriptionPanel(ap,p){
  return `<section class="rx-panel"><div class="rx-head"><div><h3>Prescription upload / photo</h3><p>Use a prescription image or PDF to quickly prefill the consultation fields. Text remains editable before saving.</p></div></div><div class="rx-actions"><label class="btn small rx-action">Upload prescription<input id="rxUpload" type="file" accept="image/*,.pdf" onchange="handlePrescriptionInput(this,'upload')"></label><label class="btn small rx-action">Take photo<input id="rxCamera" type="file" accept="image/*" capture="environment" onchange="handlePrescriptionInput(this,'photo')"></label><button type="button" class="btn small" onclick="applyPrescriptionSuggestion()">Use sample prescription text</button></div><input type="hidden" id="rxFileName"><input type="hidden" id="rxMode"><div class="rx-preview" id="rxPreview"><img id="rxImage" alt=""><div><div class="file" id="rxFileLabel"></div><div class="parsed" id="rxParsed">Ready to apply suggested clinical context, assessment and plan from the prescription.</div><button type="button" class="btn small primary" style="margin-top:10px" onclick="applyPrescriptionSuggestion()">Apply to consultation fields</button></div></div></section>`;
}
function handlePrescriptionInput(input,mode){
  const file=input.files && input.files[0]; if(!file) return;
  selectedPrescriptionFile = file;
  document.getElementById("rxFileName").value=file.name;
  document.getElementById("rxMode").value=mode;
  document.getElementById("rxFileLabel").textContent=`${mode==="photo"?"Photo captured":"Prescription uploaded"}: ${file.name}`;
  document.getElementById("rxParsed").innerHTML="Suggested text is prepared locally for this prototype. Review and edit before saving.";
  const img=document.getElementById("rxImage");
  if(file.type.startsWith("image/")){
    const r=new FileReader();
    r.onload=()=>{img.src=r.result; document.getElementById("rxPreview").classList.add("show");};
    r.readAsDataURL(file);
  } else {
    img.src="data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><rect width='120' height='120' rx='12' fill='#edf3ff'/><text x='60' y='66' text-anchor='middle' font-family='Arial' font-size='22' fill='#2d5fd2'>PDF</text></svg>`);
    document.getElementById("rxPreview").classList.add("show");
  }
  applyPrescriptionSuggestion();
}
function applyPrescriptionSuggestion(){
  const reason=val("csReason") || "Patient concern";
  const file=val("rxFileName");
  const source=file ? `Prescription reviewed (${file}).` : "Prescription details reviewed.";
  setVal("csContext", `${source}\nPatient concern: ${reason}.\nKey prescription points have been captured for consultation review.`);
  setVal("csAssess", reason.toLowerCase().includes("knee") ? "Knee pain under evaluation; correlate symptoms with examination and imaging." : "Clinical assessment updated from prescription review; confirm findings during consultation.");
  setVal("csPlan", reason.toLowerCase().includes("knee") ? "MRI right knee advised. Continue activity modification until review." : "Continue advised care. Review response and decide next step.");
  toast("Prescription details applied to consultation fields.");
}
function selectNext(k){document.querySelectorAll(".radio-card").forEach(x=>x.classList.remove("active"));document.querySelector(`input[value="${k}"]`).closest(".radio-card").classList.add("active");document.querySelector(`input[value="${k}"]`).checked=true;document.getElementById("nextFields").innerHTML=nextFields(k);}
function nextFields(k){
  if(k==="followup") return `<label>Follow-up date</label><input id="nextDate" type="date" value="${addDays(TODAY,14)}"><label style="margin-top:12px">Follow-up note</label><textarea id="nextNote">Review progress</textarea>`;
  if(k==="investigation") return `<label>Investigation / test description</label><input id="testDesc" placeholder="MRI right knee"><label style="margin-top:12px">Expected review date</label><input id="nextDate" type="date" value="${addDays(TODAY,14)}"><label style="margin-top:12px">Suggested timeframe</label><input id="timeframe" value="Review in 2 weeks">`;
  if(k==="surgery") return `<label>Brief note</label><textarea id="nextNote">Surgery discussed; patient considering</textarea><label style="margin-top:12px">Optional expected discussion date</label><input id="nextDate" type="date" value="${addDays(TODAY,7)}">`;
  if(k==="routine") return `<label>Suggested review date / timeframe</label><input id="nextDate" type="date" value="${addDays(TODAY,30)}"><textarea id="nextNote" style="margin-top:12px">Routine review later</textarea>`;
  return `<div class="confirm">No active next action will remain after this consultation.</div>`;
}
async function uploadPrescriptionFile(ap,p,file){
  if(!supabaseClient || !currentUser || !file || !p.dbId) return "";
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = `${currentUser.id}/${p.dbId}/${ap.dbId || ap.id}/${Date.now()}-${safeName}`;
  const {error} = await supabaseClient.storage.from("prescriptions").upload(path,file,{upsert:false});
  if(error){toast(`Prescription upload skipped: ${error.message}`); return "";}
  return path;
}
async function saveConsultation(apid){
  const ap=appt(apid);
  if(!ap || ap.status !== "Booked") return toast("Completed and cancelled appointments are read-only.");
  const p=patient(ap.patientId), kind=document.querySelector('input[name="nextStep"]:checked').value, reason=val("csReason"), assessment=val("csAssess"), context=val("csContext");
  let plan=val("csPlan"), expected=val("nextDate"), next="", rxFile=val("rxFileName"), rxMode=val("rxMode");
  if(kind==="investigation"){const test=val("testDesc")||"Investigation advised"; plan=plan||`${test} advised`; next=`Return for ${test} review`;}
  if(kind==="followup"){next=val("nextNote")||"Return for follow-up consultation"; plan=plan||"Follow-up advised";}
  if(kind==="surgery"){next=val("nextNote")||"Surgery decision pending"; plan=plan||"Surgery discussed";}
  if(kind==="routine"){next=val("nextNote")||"Routine review later"; plan=plan||"Routine review later";}
  if(kind==="none"){next="No further action currently"; expected=""; plan=plan||"No further action currently";}
  if(supabaseClient && currentUser && ap.dbId && p.dbId){
    const prescriptionPath = await uploadPrescriptionFile(ap,p,selectedPrescriptionFile);
    const consultation = await supabaseClient.from("consultations").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:ap.dbId,consultation_date:ap.date,reason,clinical_context:context,assessment,plan_advice:plan,next_action:next,expected_followup_date:expected || null,prescription_file_path:prescriptionPath || null,ocr_suggested_text:rxFile ? `${context}\n${assessment}\n${plan}` : null}).select("id").single();
    if(consultation.error) return toast(consultation.error.message);
    const apUpdate = await supabaseClient.from("appointments").update({status:"completed"}).eq("id",ap.dbId);
    if(apUpdate.error) return toast(apUpdate.error.message);
    const patientUpdate = await supabaseClient.from("patients").update({current_reason:reason,latest_consultation_date:ap.date,current_assessment:assessment,current_plan:plan,next_action:next,expected_followup_date:expected || null,status:kind==="none"?"closed":"active",background_note:context || p.background}).eq("id",p.dbId);
    if(patientUpdate.error) return toast(patientUpdate.error.message);
    await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:ap.dbId,consultation_id:consultation.data.id,event_date:ap.date,event_type:"consultation_completed",note:rxFile?`${rxMode==="photo"?"Prescription photo captured":"Prescription uploaded"}: ${rxFile}`:"",plan,next_action:next,expected_followup_date:expected || null});
    if(kind==="investigation") await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:ap.dbId,consultation_id:consultation.data.id,event_date:ap.date,event_type:"investigation_advised",note:val("testDesc")||plan,next_action:next,expected_followup_date:expected || null});
    if(kind==="followup"||kind==="routine") await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:ap.dbId,consultation_id:consultation.data.id,event_date:ap.date,event_type:"followup_recommended",note:val("nextNote"),next_action:next,expected_followup_date:expected || null});
    selectedPrescriptionFile = null;
    await loadPracticeData();
  } else {
    ap.status="Completed"; p.reason=reason; p.latestDate=ap.date; p.assessment=assessment; p.plan=plan; p.nextAction=next; p.expected=expected; p.status=kind==="none"?"closed":"active"; p.background=context||p.background;
    p.history.push({date:ap.date,type:"Consultation completed",reason,assessment,plan,next,detail:rxFile?`${rxMode==="photo"?"Prescription photo captured":"Prescription uploaded"}: ${rxFile}`:""}); if(kind==="investigation") p.history.push({date:ap.date,type:"Investigation advised",detail:val("testDesc")||plan,next}); if(kind==="followup"||kind==="routine") p.history.push({date:ap.date,type:"Follow-up recommended",detail:val("nextNote"),next});
    saveState();
  }
  closeDrawer(); render(); toast("Consultation saved. Patient journey updated.");
}
function openUpdateDrawer(pid){
  const p=patient(pid);
  openDrawer("Update Plan / Next Action",`<div class="field"><label>Current plan</label><textarea id="upPlan">${esc(p.plan)}</textarea></div><div class="field"><label>Next action</label><select id="upNext"><option>Follow-up date changed</option><option>Investigation completed</option><option>Patient will return later</option><option>Surgery decision pending</option><option>No further action currently</option></select></div><div class="field"><label>Expected date</label><input type="date" id="upDate" value="${esc(p.expected)}"></div><div class="field"><label>Short note</label><textarea id="upNote"></textarea></div>`,`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="saveUpdate('${pid}')">Save Update</button>`);
}
async function saveUpdate(pid){
  const p=patient(pid), next=val("upNext"), note=val("upNote");p.plan=val("upPlan");p.nextAction=next;p.expected=next==="No further action currently"?"":val("upDate");p.status=next==="No further action currently"?"closed":"active";
  if(supabaseClient && currentUser && p.dbId){
    const {error}=await supabaseClient.from("patients").update({current_plan:p.plan,next_action:next,expected_followup_date:p.expected || null,status:p.status}).eq("id",p.dbId);
    if(error) return toast(error.message);
    await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,event_date:TODAY,event_type:"plan_updated",note,plan:p.plan,next_action:next,expected_followup_date:p.expected || null});
    await loadPracticeData();
  } else {
    p.history.push({date:TODAY,type:"Plan / next action updated",plan:p.plan,next,detail:note});saveState();
  }
  closeDrawer();render();toast("Patient next action updated.");
}
function openAppointmentDrawer(pid){
  const available=Object.entries(state.availability).filter(([k,v])=>v==="available").map(([k])=>k).filter(k=>k.split("|")[0]>=TODAY).sort();
  openDrawer("Add Appointment",`<div class="field"><label>Patient</label><input readonly value="${esc(patient(pid).name)}"></div><div class="field"><label>Available slot</label><select id="apSlot">${available.map(k=>{const[d,t]=k.split("|");return `<option value="${k}">${fmtDate(d)} · ${displayTime(t)}</option>`}).join("")}</select></div><div class="field"><label>Reason for visit</label><textarea id="apReason">${esc(patient(pid).nextAction||"Follow-up consultation")}</textarea></div>${available.length?"":`<div class="confirm" style="background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)">No available slots. Publish availability in Calendar first.</div>`}`,`<button class="btn" onclick="closeDrawer()">Cancel</button><button class="btn primary" onclick="saveAppointment('${pid}')" ${available.length?"":"disabled"}>Save Appointment</button>`);
}
async function saveAppointment(pid){
  const key=val("apSlot"), [date,time]=key.split("|"), reason=val("apReason")||"Follow-up consultation", p=patient(pid);
  if(supabaseClient && currentUser && p.dbId){
    const {data,error} = await supabaseClient.from("appointments").insert({doctor_id:currentUser.id,patient_id:p.dbId,slot_date:date,slot_time:`${time}:00`,reason,status:"booked",created_source:"doctor"}).select("id").single();
    if(error) return toast(error.message);
    await supabaseClient.from("availability_slots").upsert({doctor_id:currentUser.id,slot_date:date,slot_time:`${time}:00`,status:"booked"},{onConflict:"doctor_id,slot_date,slot_time"});
    await supabaseClient.from("patients").update({next_action:"Attend scheduled consultation",expected_followup_date:date,status:"active",current_reason:reason}).eq("id",p.dbId);
    await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:data.id,event_date:TODAY,event_type:"appointment_booked",note:`${fmtDate(date)} at ${displayTime(time)} · ${reason}`,next_action:"Attend scheduled consultation",expected_followup_date:date});
    await loadPracticeData();
  } else {
    state.appointments.push({id:`AP-${Date.now()}`,patientId:pid,date,time,reason,status:"Booked"});state.availability[key]="booked";p.nextAction="Attend scheduled consultation";p.expected=date;p.history.push({date:TODAY,type:"New appointment booked",detail:`${fmtDate(date)} at ${displayTime(time)} · ${reason}`});saveState();
  }
  closeDrawer();render();toast("Appointment added.");
}
async function cancelAppointment(apid){
  const ap=appt(apid);if(!ap)return;
  if(ap.status!=="Booked") return toast("Completed and cancelled appointments are read-only.");
  const p=patient(ap.patientId);
  if(supabaseClient && currentUser && ap.dbId){
    const {error}=await supabaseClient.from("appointments").update({status:"cancelled"}).eq("id",ap.dbId);
    if(error) return toast(error.message);
    await supabaseClient.from("availability_slots").upsert({doctor_id:currentUser.id,slot_date:ap.date,slot_time:`${ap.time}:00`,status:"available"},{onConflict:"doctor_id,slot_date,slot_time"});
    if(p.dbId) await supabaseClient.from("patient_history_events").insert({doctor_id:currentUser.id,patient_id:p.dbId,appointment_id:ap.dbId,event_date:TODAY,event_type:"appointment_cancelled",note:`${fmtDate(ap.date)} at ${displayTime(ap.time)}`});
    await loadPracticeData();
  } else {
    ap.status="Cancelled";state.availability[slotKey(ap.date,ap.time)]="available";p.history.push({date:TODAY,type:"Appointment cancelled",detail:`${fmtDate(ap.date)} at ${displayTime(ap.time)}`});saveState();
  }
  render();toast("Appointment cancelled.");
}
function copyBookingLink(){navigator.clipboard?.writeText(location.href.split("#")[0]+"#book");toast("Booking link copied.");}
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function setVal(id,value){const el=document.getElementById(id);if(el) el.value=value;}
function empty(h,p){return `<div class="empty"><h3>${esc(h)}</h3>${p?`<p>${esc(p)}</p>`:""}</div>`;}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function resetDemo(){localStorage.removeItem(STORE_KEY);state=loadState();ui={screen:"today",patientId:null,week:"current",patientFilter:"All",patientSearch:"",selectedSlot:null,authMode:"login"};location.hash="";render();toast("Demo data reset.");}
boot();
</script>
