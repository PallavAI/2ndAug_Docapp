<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Doctor Practice App MVP Architecture</title>
  <desc id="desc">Architecture diagram showing doctor workspace, public booking page, Supabase authentication, PostgreSQL tables, storage, edge function emails, and local browser state.</desc>
  <defs>
    <style>
      .bg{fill:#f5f8f5}
      .title{font:700 42px Inter,Arial,sans-serif;fill:#10231f}
      .subtitle{font:400 20px Inter,Arial,sans-serif;fill:#5f6f69}
      .section-title{font:700 22px Inter,Arial,sans-serif;fill:#10231f}
      .label{font:700 18px Inter,Arial,sans-serif;fill:#10231f}
      .small{font:400 15px Inter,Arial,sans-serif;fill:#52635d}
      .tiny{font:500 13px Inter,Arial,sans-serif;fill:#66756f}
      .pill-text{font:700 13px Inter,Arial,sans-serif;fill:#ffffff}
      .card{fill:#ffffff;stroke:#d9e3df;stroke-width:2}
      .green{fill:#0f3b34}
      .green2{fill:#1f7668}
      .mint{fill:#e8f3ef;stroke:#bdd7cf;stroke-width:2}
      .amber{fill:#fff5e3;stroke:#f1c46d;stroke-width:2}
      .blue{fill:#edf4ff;stroke:#aecaef;stroke-width:2}
      .rose{fill:#fff0f0;stroke:#efaaa6;stroke-width:2}
      .gray{fill:#f2f5f4;stroke:#d3dcda;stroke-width:2}
      .line{fill:none;stroke:#57706a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#8a9a95;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 9}
      .thin{fill:none;stroke:#c7d2ce;stroke-width:2}
      .arrow{marker-end:url(#arrow)}
      .arrow2{marker-end:url(#arrow2)}
      .shadow{filter:url(#shadow)}
      .num{font:800 14px Inter,Arial,sans-serif;fill:#ffffff}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#10342d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57706a"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7668"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1050"/>

  <text x="80" y="78" class="title">Doctor Practice App MVP Architecture</text>
  <text x="82" y="112" class="subtitle">Static front end + Supabase backend for doctor login, patient journeys, bookings, consultations, files and emails</text>

  <rect x="60" y="150" width="1480" height="820" rx="26" class="card shadow"/>

  <text x="105" y="205" class="section-title">Users</text>
  <rect x="95" y="235" width="260" height="145" rx="14" class="mint"/>
  <circle cx="137" cy="277" r="24" fill="#1f7668"/>
  <path d="M128 278 h18 M137 269 v18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="180" y="270" class="label">Doctor</text>
  <text x="180" y="298" class="small">Authenticated account</text>
  <text x="180" y="324" class="small">Own practice workspace</text>
  <text x="180" y="350" class="small">Max 10 doctors in MVP</text>

  <rect x="95" y="420" width="260" height="145" rx="14" class="amber"/>
  <circle cx="137" cy="462" r="24" fill="#d88b18"/>
  <path d="M126 470 q11 -25 22 0 M137 452 a8 8 0 1 0 0 -0.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="180" y="455" class="label">Patient</text>
  <text x="180" y="483" class="small">No login required</text>
  <text x="180" y="509" class="small">Books from public page</text>
  <text x="180" y="535" class="small">Matched by mobile per doctor</text>

  <text x="470" y="205" class="section-title">Front End</text>
  <rect x="430" y="235" width="370" height="330" rx="18" class="card"/>
  <rect x="455" y="260" width="320" height="60" rx="12" class="green"/>
  <text x="480" y="297" class="pill-text">Vercel / Static Hosting</text>
  <text x="455" y="356" class="label">Single HTML App</text>
  <text x="455" y="386" class="small">HTML, CSS and vanilla JavaScript</text>
  <line x1="455" y1="415" x2="775" y2="415" class="thin"/>
  <text x="455" y="450" class="small">Doctor workspace</text>
  <text x="455" y="478" class="small">Today, Calendar, Patients, Follow-ups, Profile</text>
  <text x="455" y="506" class="small">Clickable consultation and booking workflows</text>
  <text x="455" y="534" class="small">Uses Supabase client with publishable key</text>

  <rect x="430" y="610" width="370" height="155" rx="18" class="gray"/>
  <text x="455" y="650" class="label">Browser Local State</text>
  <text x="455" y="682" class="small">Temporary UI choices and fallback demo state</text>
  <text x="455" y="710" class="small">Not the source of truth for MVP data</text>
  <text x="455" y="738" class="small">Used only where migration is still partial</text>

  <text x="935" y="205" class="section-title">Supabase Backend</text>
  <rect x="880" y="235" width="560" height="520" rx="22" class="blue"/>
  <rect x="910" y="270" width="225" height="98" rx="14" class="card"/>
  <text x="935" y="307" class="label">Supabase Auth</text>
  <text x="935" y="336" class="small">Doctor login / logout</text>

  <rect x="1185" y="270" width="225" height="98" rx="14" class="card"/>
  <text x="1210" y="307" class="label">RLS Security</text>
  <text x="1210" y="336" class="small">Each doctor sees own data</text>

  <rect x="910" y="405" width="500" height="185" rx="14" class="card"/>
  <text x="935" y="444" class="label">PostgreSQL Tables</text>
  <text x="935" y="478" class="small">doctors, patients, availability_slots</text>
  <text x="935" y="506" class="small">appointments, consultations</text>
  <text x="935" y="534" class="small">patient_history_events</text>
  <text x="935" y="562" class="small">Constraints: unique mobile per doctor, no double-booking</text>

  <rect x="910" y="625" width="225" height="92" rx="14" class="card"/>
  <text x="935" y="662" class="label">Storage</text>
  <text x="935" y="692" class="small">Private prescriptions bucket</text>

  <rect x="1185" y="625" width="225" height="92" rx="14" class="card"/>
  <text x="1210" y="662" class="label">Edge Function</text>
  <text x="1210" y="692" class="small">Booking email via Brevo</text>

  <rect x="880" y="805" width="560" height="110" rx="18" class="rose"/>
  <text x="910" y="845" class="label">Public-Safe Access</text>
  <text x="910" y="876" class="small">Public page reads only doctor name, specialty, years experience, clinic/location, fee and future available slots</text>
  <text x="910" y="904" class="small">No doctor phone, email, registration number, private address or internal notes exposed</text>

  <path class="line arrow" d="M355 300 C385 300 395 300 430 300"/>
  <path class="line arrow" d="M355 485 C385 485 395 485 430 485"/>
  <path class="line arrow" d="M800 360 C835 360 845 320 910 320"/>
  <path class="line arrow" d="M800 455 C835 455 850 500 910 500"/>
  <path class="line arrow" d="M800 520 C845 585 870 670 910 670"/>
  <path class="line arrow2" d="M1185 670 C1160 715 1125 765 1075 805"/>
  <path class="line arrow2" d="M1265 717 C1265 750 1260 775 1235 805"/>
  <path class="dash arrow" d="M615 610 C680 570 720 570 780 605"/>

  <rect x="95" y="625" width="260" height="210" rx="16" class="card"/>
  <text x="120" y="665" class="label">Core Product Flow</text>
  <circle cx="130" cy="704" r="13" class="green2"/><text x="126" y="709" class="num">1</text>
  <text x="155" y="710" class="small">Doctor publishes availability</text>
  <circle cx="130" cy="742" r="13" class="green2"/><text x="126" y="747" class="num">2</text>
  <text x="155" y="748" class="small">Patient books public slot</text>
  <circle cx="130" cy="780" r="13" class="green2"/><text x="126" y="785" class="num">3</text>
  <text x="155" y="786" class="small">Appointment appears in workspace</text>
  <circle cx="130" cy="818" r="13" class="green2"/><text x="126" y="823" class="num">4</text>
  <text x="155" y="824" class="small">Doctor saves consultation</text>

  <rect x="430" y="805" width="370" height="110" rx="18" class="mint"/>
  <text x="455" y="845" class="label">Patient Journey Is The Center</text>
  <text x="455" y="876" class="small">Each patient keeps current situation, current plan, one next action and concise history</text>
  <text x="455" y="904" class="small">Completed appointment does not close the journey unless next action is closed</text>

  <text x="80" y="1010" class="tiny">MVP rule of thumb: browser UI handles interaction; Supabase holds durable practice data; public booking exposes only approved public fields.</text>
</svg>
